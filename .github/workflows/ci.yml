name: Hexo CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build site
        run: |
          npm run clean
          npm run build

      - name: Upload generated site
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: hexo-public
          path: public/
          if-no-files-found: error
          retention-days: 7

  content-compatibility:
    name: Compare generated content with base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5

      - name: Check out base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _baseline

      - name: Prepare comparable source trees
        run: |
          node -e "
            const fs = require('node:fs');
            const file = '_baseline/_config.butterfly.yml';
            const duplicate = ' 友情链接: /link/||fa-solid fa-link\n';
            const config = fs.readFileSync(file, 'utf8');
            if (config.includes(duplicate)) {
              fs.writeFileSync(file, config.replace(duplicate, ''));
            }
          "
          sed -i 's/orderby: random/orderby: name/' _config.butterfly.yml
          sed -i 's/orderby: random/orderby: name/' _baseline/_config.butterfly.yml
          git ls-files -z | xargs -0 touch -t 202001010000
          (
            cd _baseline
            git ls-files -z | xargs -0 touch -t 202001010000
          )

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build base branch
        working-directory: _baseline
        run: |
          npm ci
          if [ -d node_modules/hexo-generator-search ]; then
            mv node_modules/hexo-generator-search .disabled-hexo-generator-search
          fi
          npm run clean
          npm run build

      - name: Build proposed changes
        run: |
          npm ci
          npm run clean
          npm run build

      - name: Verify generated content
        run: npm run verify:content -- _baseline/public public

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-comparison
          path: |
            _baseline/public/
            public/
          if-no-files-found: error
          retention-days: 7
